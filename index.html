
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Alma Prints</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#FAF8F5] font-sans">
    <nav class="bg-[#3E2723] text-[#F5F5DC] p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">Alma Prints - Panel de Gestión</h1>
    </nav>
    <div class="max-w-6xl mx-auto mt-8 p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-lg border-t-4 border-[#DDA7A5] text-center">
                <h3 class="text-[#3E2723] font-bold text-lg">Ventas Totales (S/.)</h3>
                <p id="totalVentas" class="text-3xl font-bold text-black mt-2">Cargando...</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-lg border-t-4 border-[#DDA7A5] text-center">
                <h3 class="text-[#3E2723] font-bold text-lg">Productos Activos</h3>
                <p id="totalProductos" class="text-3xl font-bold text-black mt-2">Cargando...</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-lg border-t-4 border-[#DDA7A5] text-center">
                <h3 class="text-[#3E2723] font-bold text-lg">Alertas Stock</h3>
                <p id="alertasStock" class="text-3xl font-bold text-red-600 mt-2">Cargando...</p>
            </div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-[#3E2723] font-bold text-xl mb-4 text-center">Stock Actual por Producto</h2>
            <canvas id="graficoVentas"></canvas>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
